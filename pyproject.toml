[project]
name = "elston-pickrel-revisited"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "sqlfluff>=4.5.0",
]

[tool.ruff]
line-length = 88
# The generator and grader spell out the exercise's answers; leave them alone.
extend-exclude = ["generate_synthetic_mimic.py", "phase2/grade.py"]

[tool.ruff.lint]
# Defaults plus import sorting, pyupgrade and common bug patterns.
extend-select = ["I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
